name: Build Android APK

on:
  push:
    branches: [ feature/hasanati-islamic-app, master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Generate code
      run: flutter pub run build_runner build --delete-conflicting-outputs
      continue-on-error: true
      
    - name: Run tests
      run: flutter test
      continue-on-error: true
      
    - name: Build APK
      run: flutter build apk --release
      
    - name: Build App Bundle
      run: flutter build appbundle --release
      
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: hasanati-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        
    - name: Upload App Bundle artifact
      uses: actions/upload-artifact@v4
      with:
        name: hasanati-aab
        path: build/app/outputs/bundle/release/app-release.aab
        
    - name: Create Release
      if: github.ref == 'refs/heads/feature/hasanati-islamic-app' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.0-${{ github.run_number }}
        name: Hasanati Islamic App v1.0.0-${{ github.run_number }}
        body: |
          ## حسناتي - التطبيق الإسلامي الشامل
          
          ### الميزات الجديدة:
          - 📖 القرآن الكريم مع البحث والمفضلة
          - 🕌 أسماء الله الحسنى (99 اسم) مع المعاني
          - 🤲 الأذكار والأدعية (صباح، مساء، نوم)
          - ⏰ مواقيت الصلاة مع التنبيهات
          - 🧭 اتجاه القبلة بالبوصلة
          - 📅 التقويم الهجري
          - 🌙 الوضع الليلي والنهاري
          - 🌍 دعم اللغتين العربية والإنجليزية
          - 📱 يعمل بدون إنترنت
          
          ### معلومات التطبيق:
          - **الاسم**: حسناتي (Hasanati)
          - **المطور**: Voxin
          - **الإصدار**: 1.0.0-${{ github.run_number }}
          
          ### ملفات التحميل:
          - **APK**: للتثبيت المباشر على Android
          - **AAB**: للنشر على Google Play Store
          
        files: |
          build/app/outputs/flutter-apk/app-release.apk
          build/app/outputs/bundle/release/app-release.aab
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}