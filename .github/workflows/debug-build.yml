name: Debug APK Build

on:
  workflow_dispatch:
  push:
    branches: [ feature/hasanati-islamic-app ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        
    - name: Flutter doctor
      run: flutter doctor -v
      
    - name: Get dependencies
      run: flutter pub get
      
    - name: Check Android configuration
      run: |
        echo "=== Android SDK Location ==="
        echo $ANDROID_HOME
        echo $ANDROID_SDK_ROOT
        ls -la $ANDROID_HOME || echo "ANDROID_HOME not found"
        
        echo "=== Flutter Configuration ==="
        flutter config --android-sdk $ANDROID_HOME
        flutter doctor --android-licenses || echo "License check failed"
        
        echo "=== Project Structure ==="
        ls -la android/
        ls -la android/app/
        
        echo "=== Gradle Files ==="
        cat android/app/build.gradle
        cat android/gradle.properties
        
    - name: Build APK with verbose output
      run: |
        flutter build apk --debug --verbose
      continue-on-error: true
      
    - name: Check build output
      run: |
        echo "=== Build Directory ==="
        ls -la build/ || echo "No build directory"
        ls -la build/app/ || echo "No build/app directory"
        ls -la build/app/outputs/ || echo "No build/app/outputs directory"
        ls -la build/app/outputs/flutter-apk/ || echo "No APK output directory"
        
    - name: Upload any APK found
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: debug-apk
        path: build/app/outputs/flutter-apk/*.apk
        if-no-files-found: ignore